<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jevicarn School System | Profile</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#14335f">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-body">
  <main class="content single">
    <section class="topbar glass">
      <div>
        <div class="eyebrow">Profile</div>
        <h1>{{ profile_user.full_name }}</h1>
        <div class="muted">{{ workspace }}</div>
      </div>
      <div class="top-actions">
        <a class="btn btn-ghost" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        <a class="btn btn-ghost" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </section>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <section class="panel glass profile-card">
      <div class="panel-head">
        <div>
          <div class="eyebrow">Account Details</div>
          <h3>Edit profile</h3>
        </div>
      </div>
      <form class="stack-form" method="post">
        <label><span>Full Name</span><input name="full_name" value="{{ profile_user.full_name }}" required></label>
        <label><span>Username</span><input value="{{ profile_user.username }}" disabled></label>
        <label><span>Role</span><input value="{{ profile_user.role }}" disabled></label>
        <label><span>New Password</span><input name="password" type="password" placeholder="Leave blank to keep current"></label>
        <button class="btn btn-primary" type="submit">Save Changes</button>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
